name: Profile art

# Regenerates metrics.svg (lowlighter/metrics) and profile-3d-contrib/ (yoshi389111/github-profile-3d-contrib).
# Needs secret METRICS_TOKEN: a classic PAT with `repo` and `read:user` scopes, so private activity is counted.

on:
  schedule:
    - cron: "30 0 * * *" # daily 06:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency: profile-art

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          user: DrARaj
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          config_timezone: Asia/Kolkata
          base: header, activity, community, repositories
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_achievements: yes
          plugin_achievements_display: compact

  contrib-3d:
    needs: metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: DrARaj
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib
          git commit -m "chore: refresh 3D contribution graph" || exit 0
          git pull --rebase
          git push
